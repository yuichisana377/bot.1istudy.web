<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>お知らせ — 1I勉強会</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/Style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  /* 編集／プレビュー タブ（.view-toggle / .view-btn と統一デザイン） */
  .notice-editor-tabs{
    display:flex; background:var(--bg); border-radius:var(--r-md);
    padding:3px; gap:2px; border:1px solid var(--border); margin-bottom:8px; width:fit-content;
  }
  .notice-tab{
    padding:5px 13px; font-size:12px; font-weight:500; color:var(--text-secondary);
    border:none; background:none; border-radius:var(--r-sm); cursor:pointer; transition:all .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .notice-tab.active{
    background:var(--surface); color:var(--text); font-weight:600; box-shadow:var(--shadow);
  }

  /* 下書き復元バナー（バッジ／今日ボタンと同じ青系のお知らせカラー） */
  .notice-draft-banner{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#dbeafe; color:#1e40af; border:1px solid #bfdbfe; border-radius:var(--r-sm);
    padding:10px 13px; margin-bottom:12px; font-size:13px;
  }
  .notice-draft-banner button{
    font-size:12px; font-weight:600; padding:4px 11px; border-radius:20px;
    border:1px solid #bfdbfe; background:var(--surface); color:#1e40af; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .notice-draft-banner button:active{ background:#bfdbfe; }

  .notice-draft-status{ font-size:11px; color:var(--text-tertiary); margin-top:5px; min-height:14px; }
  .notice-filename-hint{ font-size:11px; color:var(--text-tertiary); margin-top:5px; }
</style>
</head>
<body>
<div id="js-fail-fallback" style="position:fixed;inset:0;z-index:999999;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:sans-serif;">
  <div style="max-width:340px;width:100%;text-align:center;">
    <div class="jsfb-spinner" style="width:40px;height:40px;margin:0 auto 16px;border:4px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:jsfb-spin 1s linear infinite;"></div>
    <div style="font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px;">読み込み中です…</div>
    <div style="font-size:13px;color:#64748b;line-height:1.6;margin-bottom:18px;">しばらく待っても変わらない場合は、下から問題を報告できます</div>
    <details style="text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;">
      <summary style="cursor:pointer;font-size:13px;font-weight:600;color:#475569;">問題を報告する</summary>
      <form method="POST" action="/api/report_problem" style="margin-top:10px;">
        <input type="hidden" name="guild_id" value="1509880344806162544">
        <input type="hidden" name="page" value="お知らせ（Notice.html）">
        <textarea name="message" rows="3" maxlength="500" placeholder="症状を書いてください（省略可）" style="width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;"></textarea>
        <button type="submit" style="margin-top:8px;width:100%;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;">送信する</button>
      </form>
    </details>
  </div>
</div>
<style>
@keyframes jsfb-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .jsfb-spinner { animation: none; } }
</style>


<!-- ドロワーオーバーレイ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

<!-- ★ 追加：ページ遷移中ローディング（メニュー選択直後、読み込み中の合図） -->
<div class="page-nav-loading" id="page-nav-loading"><div class="spinner-lg"></div></div>

<!-- ドロワー -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="app-name"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M12 6.2c-2-1.3-4.6-2-7.2-2v13c2.6 0 5.2.7 7.2 2 2-1.3 4.6-2 7.2-2v-13c-2.6 0-5.2.7-7.2 2Z"/><path d="M12 6.2v13"/></svg> 1I 勉強会web</div>
    <div class="app-sub">統合学習ツール</div>
  </div>
  <nav class="drawer-nav">
    <a class="drawer-item" href="/index.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8.4 14.6l2 2 4.2-4.6"/></svg></span>予定管理
    </a>
    <a class="drawer-item" href="/Timetable.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M9.5 9.5v10"/><path d="M15 9.5v10"/></svg></span>時間割
    </a>
    <a class="drawer-item" href="/Cardmaker.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><rect x="3.5" y="8.5" width="13" height="9" rx="1.6"/><rect x="7.5" y="4.8" width="13" height="9" rx="1.6"/></svg></span>CardMaker
    </a>
    <a class="drawer-item" href="/StudyLog.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M4 20h16"/></svg></span>勉強ログ
    </a>
    <a class="drawer-item active" href="/Notice.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M3 10.2v3.6h3.2l6.8 3.7V6.5l-6.8 3.7Z"/><path d="M15.5 9a3.8 3.8 0 0 1 0 6"/><path d="M18 6.7a7.3 7.3 0 0 1 0 10.6"/></svg></span>お知らせ
    </a>
    <a class="drawer-item" href="/ServiceInfo.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M14.8 6.4a4 4 0 0 0-5.5 5.5L4 17.2 6.8 20l5.3-5.3a4 4 0 0 0 5.5-5.5l-2.7 2.7-2-2 2.7-2.7Z"/></svg></span>サービス情報
    </a>
    <a class="drawer-item" href="/TanCheck.html">
      <span class="di-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M3 9l9-4 9 4-9 4-9-4Z"/><path d="M7 11v4c0 1.5 2.5 3 5 3s5-1.5 5-3v-4"/><path d="M20 9v6"/></svg></span>単位チェッカー
    </a>
  </nav>
  <!-- ★ 追加：だれとしてログインしているかを表示（2026/08/19） -->
  <div class="drawer-account" id="drawer-account"></div>
</div>

<div class="scroll-body">

  <!-- ヘッダー -->
  <header class="header">
    <button class="menu-btn" onclick="openDrawer()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M4 6.5h16"/><path d="M4 12h16"/><path d="M4 17.5h16"/></svg></button>
    <span class="header-title">お知らせ</span>
    <button class="today-btn-plan" onclick="openUploadModal()">＋ アップロード</button>
  </header>

  <!-- メインコンテンツ -->
  <main class="plan-main">
    <div class="loading" id="notice-loading">読み込み中…</div>
    <div id="notice-content"></div>
  </main>

</div>

<!-- 詳細（プレビュー）モーダル -->
<div class="modal-bg" id="modal-view" onclick="onBgClickNotice(event,'view')">
  <div class="modal">
    <span class="modal-handle"></span>
    <div class="modal-header">
      <div>
        <h3 id="view-filename">お知らせ</h3>
        <span class="notice-meta" id="view-meta"></span>
      </div>
      <button class="modal-close" onclick="closeNoticeModal('view')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px;flex-shrink:0" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </div>
    <div class="loading" id="view-loading" style="display:none">読み込み中…</div>
    <div class="notice-body" id="view-body"></div>
    <div class="notice-actions">
      <button class="notice-done-btn" id="view-done-btn" onclick="toggleNoticeDoneFromModal()">実行済みにする</button>
      <button class="notice-edit-btn" id="view-edit-btn" onclick="openEditModal()">編集する</button>
      <button class="notice-del-btn" id="view-delete-btn" onclick="deleteCurrentNotice()">削除する</button>
    </div>
  </div>
</div>

<!-- 削除の確認依頼モーダル（投稿者本人以外が削除しようとしたとき） -->
<div class="modal-bg" id="modal-request-delete" onclick="onBgClickNotice(event,'request-delete')">
  <div class="modal">
    <span class="modal-handle"></span>
    <div class="modal-header">
      <h3>本人の確認が必要です</h3>
      <button class="modal-close" onclick="closeNoticeModal('request-delete')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px;flex-shrink:0" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </div>
    <p id="request-delete-desc" style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:.85rem"></p>
    <div class="field">
      <label>削除したい理由</label>
      <textarea id="request-delete-reason" rows="4" maxlength="500" placeholder="例：内容が古いため／重複しているため など"
        style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);
        font-size:14px;background:var(--bg);color:var(--text);outline:none;resize:vertical;font-family:inherit;"></textarea>
    </div>
    <div class="error-bar" id="request-delete-err"></div>
    <button class="btn-primary" id="request-delete-submit-btn" onclick="submitRequestDelete()">送信する</button>
  </div>
</div>

<!-- アップロードモーダル -->
<div class="modal-bg" id="modal-upload" onclick="onBgClickNotice(event,'upload')">
  <div class="modal">
    <span class="modal-handle"></span>
    <div class="modal-header">
      <h3>お知らせをアップロード</h3>
      <button class="modal-close" onclick="closeNoticeModal('upload')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px;flex-shrink:0" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </div>
    <div class="success-bar" id="upload-ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px;flex-shrink:0" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg> アップロードしました！</div>
    <div class="error-bar"   id="upload-err"></div>

    <div class="notice-draft-banner" id="draft-banner" style="display:none;">
      <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px;flex-shrink:0" aria-hidden="true"><path d="M6 4h9l3 3v13H6Z"/><path d="M15 4v3h3"/><path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h3"/></svg> 保存されている下書きがあります</span>
      <button type="button" onclick="restoreDraft()">復元する</button>
      <button type="button" onclick="discardDraft()">破棄する</button>
    </div>

    <div class="field">
      <label>ファイル名（.md または .txt）</label>
      <input type="text" id="upload-filename" placeholder="例: 2026-07-25_お知らせ.md" oninput="onFilenameInput()">
      <div class="notice-filename-hint" id="filename-hint"></div>
    </div>
    <div class="field">
      <label>投稿者</label>
      <div class="notice-uploader-display" id="upload-uploader-display">読み込み中…</div>
    </div>
    <div class="field">
      <label>内容</label>
      <div class="notice-editor-tabs">
        <button type="button" class="notice-tab active" id="tab-edit-btn" onclick="switchNoticeTab('edit')">編集</button>
        <button type="button" class="notice-tab" id="tab-preview-btn" onclick="switchNoticeTab('preview')">プレビュー</button>
      </div>
      <textarea id="upload-content" rows="10" placeholder="お知らせの本文を入力…" oninput="onContentInput()"
        style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);
        font-size:14px;background:var(--bg);color:var(--text);outline:none;resize:vertical;
        font-family:inherit;line-height:1.6;"></textarea>
      <div class="notice-body" id="upload-preview" style="display:none;"></div>
      <div class="notice-draft-status" id="draft-status"></div>
    </div>

    <!-- ファイルから読み込む場合 -->
    <div class="field">
      <label>またはPCから .md / .txt ファイルを選択</label>
      <input type="file" id="upload-file-input" accept=".md,.txt" onchange="onLocalFileSelected(event)">
    </div>

    <button class="btn-primary" onclick="submitUpload()">アップロードする</button>
  </div>
</div>

<script src="/Icons.js"></script>
<script src="/SwipeGuard.js"></script>
<script src="/Dialog.js"></script>
<script src="/Notice.js"></script>
<script src="/PendingDeleteCheck.js"></script>
</body>
</html>
